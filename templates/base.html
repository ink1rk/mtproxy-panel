<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MTProxy Control Panel{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
    <link href="/static/css/theme.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div id="panelProgress" aria-hidden="true"></div>

<!-- Лайтбокс QR: общий для всех страниц, наполняется через theme.js -->
<div id="qrLightbox" class="qr-lightbox" aria-hidden="true">
    <button type="button" class="qr-lightbox-close" aria-label="Закрыть"><i class="bi bi-x-lg"></i></button>
    <div class="qr-lightbox-figure">
        <img src="" alt="QR" class="qr-lightbox-img">
        <div class="qr-lightbox-caption" id="qrLightboxCaption"></div>
        <div class="qr-lightbox-hint">Нажмите в любом месте, чтобы закрыть</div>
    </div>
</div>

{% block body %}{% endblock %}

<!-- Общие зависимости: подключены один раз здесь, а не в каждом шаблоне -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/theme.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
