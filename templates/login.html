{% extends "base.html" %}
{% block title %}Вход — MTProxy Control Panel{% endblock %}
{% block body %}
<div class="auth-shell">
    <div class="card-surface p-4 p-md-5 position-relative u-fade-up" style="width: 100%; max-width: 420px; z-index: 1;">
        <div class="text-center mb-4">
            <span class="stat-card-icon is-brand mx-auto mb-2" style="width:56px;height:56px;font-size:1.6rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </span>
            <h1 class="h4 mt-2 mb-0">MTProxy Control Panel</h1>
            <p class="text-secondary small mb-0">Войдите, чтобы управлять прокси и VPN</p>
        </div>

        {% if error_message %}
        <div class="alert alert-danger py-2 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle"></i> {{ error_message }}
        </div>
        {% endif %}

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label small text-secondary">Логин</label>
                <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary">Пароль</label>
                <input type="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn brand-gradient-btn text-white w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-in-right"></i> Войти
            </button>
        </form>
    </div>
</div>
{% endblock %}
